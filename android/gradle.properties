org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# newDsl=false for google-services 4.3.15 compatibility
android.newDsl=false
# builtInKotlin=false: record_android 1.5.2 still applies kotlin-android plugin explicitly
android.builtInKotlin=false
# Ignore JVM target mismatch between Java (17) and Kotlin (default) - both are compatible
kotlin.jvm.target.validation.mode=IGNORE
